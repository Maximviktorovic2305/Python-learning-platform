limit_req_zone $binary_remote_addr zone=python_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=python_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=python_execution:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name python-learning.tech www.python-learning.tech;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://python-learning.tech$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.python-learning.tech;
    ssl_certificate /etc/letsencrypt/live/python-learning.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/python-learning.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://python-learning.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name python-learning.tech;
    ssl_certificate /etc/letsencrypt/live/python-learning.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/python-learning.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    client_max_body_size 128k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    location /api/auth/ {
        limit_req zone=python_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3010;
    }
    location ~ ^/api/exercises/[^/]+/submit$ {
        limit_req zone=python_execution burst=3 nodelay;
        proxy_pass http://127.0.0.1:3010;
    }
    location /api/ {
        limit_req zone=python_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3010;
    }
    location / { proxy_pass http://127.0.0.1:3010; }
}
