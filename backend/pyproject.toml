[project]
name = "python-lab-api"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.143.0", "pydantic[email]==2.14.1", "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.1.4", "asyncpg==0.32.0", "alembic==1.20.0",
  "pwdlib[argon2]==0.3.1", "PyJWT==2.15.1", "uvicorn==0.54.0",
  "httpx==0.28.1", "tzdata==2026.5",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio>=1.2,<2", "httpx>=0.28,<1", "ruff==0.17.0", "aiosqlite>=0.21,<1", "mypy>=1.18,<2", "types-PyYAML", "tzdata"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "migrations/env.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
